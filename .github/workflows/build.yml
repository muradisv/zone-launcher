name: Build Zone Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/zone/launcher
          cat > settings.gradle <<'ZL_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZoneLauncher"
          include ':app'
          ZL_EOF
          cat > build.gradle <<'ZL_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          ZL_EOF
          cat > gradle.properties <<'ZL_EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          ZL_EOF
          cat > app/build.gradle <<'ZL_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zone.launcher'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.zone.launcher'
                  minSdk 21
                  targetSdk 33
                  versionCode 4
                  versionName '1.3'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          ZL_EOF
          cat > app/src/main/AndroidManifest.xml <<'ZL_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Zone Launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|uiMode|locale|layoutDirection|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          ZL_EOF
          cat > app/src/main/java/com/zone/launcher/BootReceiver.java <<'ZL_EOF'
          package com.zone.launcher;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      Intent i = new Intent(context, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                      context.startActivity(i);
                  } catch (Exception ignored) {
                  }
              }
          }
          ZL_EOF
          mkdir -p app/src/main/res/drawable-nodpi
